[build]
  command = "cd app && npm install && npm run build && cd ../netlify/functions && npm install"
  publish = "dist"
  functions = "netlify/functions"

# ── Secrets scanning ─────────────────────────────────────────────────────────
# La SUPABASE_SERVICE_ROLE_KEY se usa SOLO en las funciones serverless (backend),
# que no son públicas. El escáner de Netlify la detecta en el bundle de funciones
# y da un falso positivo. La omitimos del escaneo (sigue siendo secreta y NUNCA
# se expone al navegador, porque no lleva prefijo VITE_ ni se usa en app/src).
# Si alguna vez ves este secreto en dist/ (frontend), NO lo omitas: sería fuga real.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY"

# Empaquetado de funciones: esbuild incluye las dependencias (pdf-lib, pptxgenjs)
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-lib", "pptxgenjs"]

# Feed .ics suscribible de la agenda
[[redirects]]
  from = "/api/agenda-feed"
  to = "/.netlify/functions/agenda-feed"
  status = 200

# Generación automática de oferta (PDF + PPTX)
[[redirects]]
  from = "/api/generar-oferta"
  to = "/.netlify/functions/generar-oferta"
  status = 200

# SPA: cualquier ruta bajo /app/ sirve la app React
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# www → apex
[[redirects]]
  from = "https://www.consultify.pro/*"
  to = "https://consultify.pro/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
