[build]
  command = "cd app && npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Feed .ics suscribible de la agenda
[[redirects]]
  from = "/api/agenda-feed"
  to = "/.netlify/functions/agenda-feed"
  status = 200

# SPA: cualquier ruta bajo /app/ sirve la app React
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# www → apex
[[redirects]]
  from = "https://www.consultify.pro/*"
  to = "https://consultify.pro/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
